          CHANNELS_JSON='["信報財經新聞","Finance730","香港經濟日報 HKET","香港財經時報 HKBT","新城財經台","香港金融管理局","游庭皓的財經皓角","柴鼠兄弟 ZRBros","风傳媒-下班经济學","老王愛說笑","自由女神邱沁宜","Better Leaf 好葉","慢活夫妻 George & Dewi","大俠武林","股乾爹 KuKanTieh","Gooaye股癌","理財不能等","懶錢包LazyWallet","M觀點","蕾咪Rami","財經 M 平方 MacroMicro","元大投顧財金頻道","股海老牛","财经风云","视野环球财经","阳光财经","ChineseFN 中文投資網","财经全世界","老李玩钱","土妹发财","贝拉说美股","美投说美股","艾爾文","寶可孟の省錢大作戰","吳淡如人生實用商學院","郭哲榮分析師","央视财经","Bloomberg中国","老徐价值投资","小Lin说","钱姐说钱","硅谷居士","财报狗","天下杂志","商业周刊","今周刊","非凡财经新闻","东森财经新闻","第一财经","FT中文网","观视频工作室","睡前消息","曲博科技教室","Now 財經 新聞","經濟一週 EDigest","RagaFinance財經台","阿豬 Ah Ju","溫鋼城投藝頻道","LION哥的投資世界","小翠時政財經","Tasty Money 港股直播室","熊麗萍Conita","財經拆局","住加財經 CanFin","富昌金融集團","郭Sir財經","全職炒家 RON LAU","陳sir港股美股分析@致富學院","樂在旅途財經人 連敬涵","粵語最財經","陽光財經粵語頻道","浮浪者 股市浪人","HKStockFinance","港樓x講事Channel","樓市專家 Ken Lui 呂宇健","Talk HK Property","SIU TING MAK","港股研究室","明報財經 MP Finance","灣區揭揭揭 - Tomson實錄","香港小電Callcall","OpenRice大灣區","大灣區夫婦 (Benny & Nicole)","TVB NEWS Official 無綫新聞","HOY 78 × 有線新聞 Cable News","香港01","RTHK 香港電台","香港電台公共事務組RTHK","星島頭條","明報 Mingpao","on.cc東網","am730","Sky Post晴報","商業電台 Hong Kong Toolbar","灼見名家 Master Insight","灼見名家保健養生","ISD, Hong Kong SAR Government 香港特區政府新聞處","香港新聞頻道","粵語新聞台","MPWeekly明周","星島娛樂","am娛樂","健康730","危險人物 Dangerous Person 2.0","午後檔案","BIGBIGAIR","UNWIRE.HK","Qooah.com","電影Ching報","HKJC","賽馬會青少年體育記者計劃","博擊會Fightclub","TVB (official)","澳門日報-Macao Daily News","TDM 澳廣視新聞","澳廣視 MACAU TDM","macaogcs 澳門特別行政區政府新聞局","澳門力報 exmoo","澳門教區社會傳播中心CDMCS Macau","官方頻道澳亞衛視","澳門故事","澳門肥坤MacauWK Walker","Touch电视剧","Guangdong-Hong Kong-Macao Greater Bay Area粵港澳大灣區","大灣區的蟻民","大灣區侶遊 Couple Travel GBA","巴迪叔叔-港人移居大灣區的退休生活","新時代電視 Fairchild Television","Sing Tao A1 Chinese Radio","MingPaoCanada","MingPao Daily Vancouver明報溫哥華","Moon媽在英生活","走佬去UK","JASON","Ricky講煮講食","曾鎧琪 Alison【香港曾小妹】","May in Hong Kong 私の香港生活","K.A.T.","東京情報猿","香港美食 by Alexis","HKMINICHEF","リンモク 鈴木 Lingmuk【廣東話學習Vlog】","TVB 奇幻穿越劇場 (TVB Fantasy Drama)","TVB 綜藝","TVB Anywhere Life","TVB Best Drama 熱播劇場","TVB Drama – Comedy 喜劇台","TVB Drama – Action & WuXia 動作武俠","TVB Drama - Crime & Mystery 神秘頻道","灼見名家文化教育","星島溫哥華","Fairchild TV FTV","香港人看英國新聞"]'
          echo "Channels: $CHANNELS_JSON"

          # 与手动扫描共用服务端限速：每读取 10 条暂停 10 秒后继续
          SCAN_RESP=$(curl -s --max-time 5400 -X POST http://localhost:3000/api/scan \
            -H 'Content-Type: application/json' \
            -d "{\"channels\": $CHANNELS_JSON}")
          echo "$SCAN_RESP" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
              try{const j=JSON.parse(d);if(!j.items) throw Error('no items'); console.log('扫描到', j.items.length, '条');}
              catch(e){console.error('扫描结果解析失败',e.message, d.slice(0,500)); process.exit(1)}
            })"
          echo "$SCAN_RESP" > scan_result.json

          # 如果有 token 则推送
          if [ -n "$PUSHPLUS_TOKEN" ]; then
            node --input-type=module << 'NODE'
            import fs from 'node:fs';
            import { filterSensitiveHtml, filterSensitiveText, getSensitiveWordStats } from './sensitive-filter.mjs';
          import { compactBriefHtml } from './html-compact.mjs';
            import { sentimentLabel, analyzeQuantWorkflow } from './longshort.mjs';
            import { buildRuleSummary, renderSummaryHtml } from './ai.mjs';
            const scan = JSON.parse(fs.readFileSync('scan_result.json','utf8'));
            const allItems = scan.items || [];
            // 时效验证：只保留最近 72 小时内发布的内容（超时 / 无法验证发布时间 → 隐藏，不推送）
            const FRESH_WINDOW_MS = 72*60*60*1000;
            const FRESH_WINDOW_LABEL = '72 小时';
            const nowMs = Date.now();
            const isFresh = x => {
              if (x.error) return true;
              const t = x.publishedAt ? new Date(x.publishedAt).getTime() : NaN;
              return Number.isFinite(t) && (nowMs - t) <= FRESH_WINDOW_MS;
            };
            const items = allItems.filter(isFresh);
            const hiddenItems = (scan.hidden || []);
            console.log(`时效验证：保留 ${items.length} 条，隐藏 ${allItems.length - items.length} 条（服务端另记录 ${hiddenItems.length} 条超时/无法验证）`);
            if (!items.length || !items.some(x => !x.error)) {
              console.log(`最近 ${FRESH_WINDOW_LABEL}内没有可推送的有效内容（超时内容已隐藏），本次不推送。`);
              fs.writeFileSync('brief.html', '<p>最近 ' + FRESH_WINDOW_LABEL + '内没有新的内容（超时内容已隐藏）</p>');
              fs.writeFileSync('chunks.json', JSON.stringify({ header: '', footer: '', chunks: [], title: '' }, null, 2));
              process.exit(0);
            }
            const esc = s => String(s||'').replace(/[&<>\"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;' }[c]));

            // 不推个股页：剥离简报中任何按个股拆分的板块/页面，只保留全景汇总
            function stripStockSections(html) {
              if (!html) return html;
              let out = String(html);
              out = out.replace(/<section\b[^>]*data-kind=(["'])stock-page\1[^>]*>[\s\S]*?<\/section>/gi, '');
              out = out.replace(/<section\b[^>]*class=(["'])[^"']*\bstock-page\b[^"']*\1[^>]*>[\s\S]*?<\/section>/gi, '');
              out = out.replace(/<section\b[^>]*>[\s\S]*?<\/section>/gi, (m) =>
                /&gt;\s*(个股页|個股頁|STOCK PAGE)\s*<|>(个股页|個股頁|STOCK PAGE)</.test(m) ? '' : m);
              return out;
            }

            const quant = analyzeQuantWorkflow(items);
            // AI 多空概率（看多 / 看空）+ 五档情绪标签：微信会剥离 class，因此全部 inline
            // 多 / 空 同一行显示；每条不再附模型 / 免责 / 未读取正文等说明文字，仅保留方向短注
            const lsBar = (v, w = 10) => { const k = Math.max(0, Math.min(w, Math.round(v / 100 * w))); return '█'.repeat(k) + '░'.repeat(w - k); };
            const lsBlock = x => {
              const bb = x.bullBear;
              if (!bb || typeof bb.bull !== 'number') return '';
              const tag = sentimentLabel(x);
              const wText = bb.weightPct != null ? ` · 权重 ${bb.weightPct}%` : '';
              return `<div style="margin-top:6px;padding:6px 7.5px;background:#031203;border:1px solid #0d9b4c;">
                      <div style="display:flex;justify-content:space-between;align-items:center;gap:4.5px;font-family:'Courier New',Consolas,monospace;font-size:7px;flex-wrap:wrap;">
                        <span style="background:#00ff66;color:#041404;padding:0.75px 3.75px;font-weight:700;letter-spacing:0.5px;">AI 多空概率 · ${esc(tag)}</span>
                        <span style="background:#041404;color:#b8f2cb;padding:0.75px 3.75px;font-weight:700;">多 ${bb.bull}% / 空 ${bb.bear}%${esc(wText)}</span>
                      </div>
                      <div style="margin-top:4.5px;font-family:'Courier New',Consolas,monospace;font-size:8.5px;color:#b8f2cb;font-weight:700;line-height:1.7;word-break:break-all;">多 ${lsBar(bb.bull)} ${bb.bull}% ｜ 空 ${lsBar(bb.bear)} ${bb.bear}%</div>
                      ${bb.note ? `<div style="margin-top:3px;font-family:'Courier New',Consolas,monospace;font-size:7px;color:#63b47f;line-height:1.5;">${esc(bb.note)}</div>` : ''}
                    </div>`;
            };

            const sections = items.map((x,i)=> x.error
              ? `<section style="margin:7.5px 0;border:1px solid #b98600;background:#1a1203;box-shadow:0 0 6px rgba(255,176,0,0.15);font-family:'Courier New',Consolas,'SimSun',monospace;">
                  <div style="display:flex;align-items:center;gap:4.5px;background:#ffb000;color:#041404;padding:2.25px 6px;font-family:'Courier New',Consolas,monospace;font-size:8px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;">
                    <span style="background:#041404;color:#ffb000;padding:0.75px 3.75px;">■</span>
                    <span>SCAN_ERROR.LOG</span>
                    <span style="margin-left:auto;background:#041404;color:#8a6a12;padding:0.75px 3.75px;font-weight:400;">[${i+1}] ${esc(x.channel)} · 未完成读取</span>
                  </div>
                  <p style="margin:6px 7.5px;color:#ffb000;font-size:9.5px;line-height:1.4;font-weight:700;font-family:'Courier New',Consolas,monospace;">&gt; ${esc(x.error)}</p>
                </section>`
              : `<section style="margin:7.5px 0;border:1px solid #0d9b4c;background:#072007;box-shadow:0 0 6px rgba(0,255,102,0.15);font-family:'Courier New',Consolas,'SimSun',monospace;">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:4.5px;background:#00ff66;color:#041404;padding:2.25px 6px;font-family:'Courier New',Consolas,monospace;font-size:8px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:4.5px;min-width:0;word-break:break-all;">
                      <span style="background:#041404;color:#00ff66;padding:0.75px 3.75px;font-weight:400;">#${i+1}</span>
                      <span>DIR ▸ ${esc(x.channel)}</span>
                    </div>
                    ${x.status?`<span style="background:#041404;color:#8fdca4;padding:0.75px 3.75px;flex-shrink:0;font-weight:400;">${esc(x.status)}</span>`:''}
                  </div>
                  <div style="padding:7.5px 9px;">
                    <div style="color:#2c6742;font-family:'Courier New',Consolas,monospace;font-size:7.5px;letter-spacing:0.5px;font-weight:400;">C:\\BRIEF\\LOGS&gt; ${esc(x.publishedLabel || x.published || '')}${x.publishedMacau ? ' · ' + esc(x.publishedMacau) : ''}${x.viewsText ? ' · ' + esc(x.viewsText) : ''}${x.subscribersText ? ' · ' + esc(x.subscribersText) : ''} · 时效验证 ✓ ${FRESH_WINDOW_LABEL}内</div>
                    <h3 style="margin:4.5px 0 6px;font-size:11.5px;line-height:1.35;font-weight:700;">
                      <a href="${esc(x.url)}" style="color:#eafff0;font-weight:700;text-decoration:underline;text-decoration-color:#3f8f5b;text-underline-offset:3px;word-break:break-all;">&gt; ${esc(x.title)}</a>
                    </h3>
                    ${x.transcriptInfo ? `<div style="color:#63b47f;font-size:8px;">${esc(x.transcriptInfo.message)}</div>` : ''}
                    ${lsBlock(x)}
                    ${x.transcript ? `
                      <div style="margin-top:6px;padding:6px 7.5px;background:#031203;border-left:3px solid #0d9b4c;color:#8fdca4;white-space:pre-wrap;word-break:break-word;font-size:9.5px;line-height:1.55;font-weight:400;">${esc(x.transcript).replace(/(^|\n)(\d{1,2}:\d{2}(?::\d{2})?)/g, '$1<span style="color:#2c6742;font-size:8px;">$2</span>')}</div>
                    ` : ''}
                  </div>
                </section>`
            ).join('');

            // 推送开头 AI 总结概括（DeepSeek / 四步可量化工作流总结）
            let summaryHtml = '';
            try {
              const r = await fetch('http://localhost:3000/api/summarize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items })
              });
              const d = await r.json();
              if (r.ok && d && d.ok && d.summaryHtml) {
                summaryHtml = d.summaryHtml;
                console.log('✅ 已附加推送开头 AI 可量化工作流总结');
              } else {
                summaryHtml = renderSummaryHtml(buildRuleSummary(items), { itemCount: items.length, quant });
                console.log('ℹ️ 使用本地四步可量化工作流总结');
              }
            } catch (e) {
              summaryHtml = renderSummaryHtml(buildRuleSummary(items), { itemCount: items.length, quant });
              console.log('⚠️ AI 总结接口异常，已使用本地四步可量化工作流总结：', e.message);
            }

            const baseContent = `<div style="font-family:'Courier New',Consolas,'SimSun',monospace;background-color:#041404;color:#8fdca4;padding:10.5px 9px;font-size:10px;line-height:1.55;max-width:680px;margin:0 auto;box-sizing:border-box;letter-spacing:0.3px;">

              <!-- DOS 顶部命令行 / Command Bar -->
              <div style="display:flex;justify-content:space-between;align-items:center;padding:4.5px 6px;border-bottom:1px dashed #0d9b4c;font-family:'Courier New',Consolas,monospace;font-size:8px;margin-bottom:9px;letter-spacing:0.5px;flex-wrap:wrap;gap:3px;">
                <div style="display:flex;align-items:center;gap:4.5px;">
                  <span style="display:inline-block;width:7px;height:7px;background:#00ff66;box-shadow:0 0 4px rgba(0,255,102,0.8);"></span>
                  <span style="color:#00ff66;font-weight:700;">C:\\OCTOPUS\\AI&gt; PANORAMA.EXE</span>
                </div>
                <span style="background:#00ff66;color:#041404;padding:0.75px 4.5px;font-weight:700;font-size:7px;">DOS MONITOR · 复古终端</span>
              </div>

              <!-- 时效验证说明：只保留最近 72 小时内发布的内容 -->
              <div style="display:flex;justify-content:space-between;align-items:center;padding:4.5px 6px;border:1px dashed #0d9b4c;background:#031203;font-family:'Courier New',Consolas,monospace;font-size:7.5px;margin-bottom:9px;letter-spacing:0.5px;flex-wrap:wrap;gap:3px;">
                <span style="color:#00ff66;font-weight:700;">FRESHNESS CHECK ▸ 只保留最近 ${FRESH_WINDOW_LABEL}内发布的内容</span>
                <span style="color:#63b47f;font-weight:400;">超时 / 无法验证发布时间的内容已隐藏 · 本次共 ${items.length} 条</span>
              </div>

              <!-- 视频情报流 -->
              ${sections}

              <!-- 尾页宣言 / Editorial Manifesto -->
              <div style="margin-top:12px;border:1px solid #0d9b4c;background:#072007;box-shadow:0 0 8px rgba(0,255,102,0.18);">
                <div style="display:flex;justify-content:space-between;align-items:center;background:#00ff66;color:#041404;padding:2.25px 6px;font-family:'Courier New',Consolas,monospace;font-size:7.5px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;gap:3px;">
                  <span>EDITORIAL_MANIFESTO.TXT</span>
                  <span style="font-weight:400;opacity:0.75;">章鱼 AI · 全景视野</span>
                </div>
                <div style="padding:9px;">
                  <div style="font-size:10px;font-weight:700;color:#eafff0;line-height:1.4;margin-bottom:6px;">
                    作者：章鱼 ai &nbsp; &nbsp; &nbsp; 仅供参考，分析研究
                  </div>
                  <div style="font-size:9.5px;color:#63b47f;line-height:1.6;text-align:justify;border-left:3px solid #0d9b4c;padding:6px 7.5px;background:#031203;margin-bottom:7.5px;">
                    <span style="color:#00ff66;font-weight:700;">全网境内外为你寻找蛛丝马迹-提供全景视野分析</span> 由多模型协同推理决策 ，底层所使用的大语言模型（LLM）多模式背后结合使用了多种不同的先进模型，包括但不限于 Claude、ChatGPT、Gemini、Grok、Qwen 以及 Kimi。 根据不同的资产管理任务需求，更好地发挥各个模型的优势来提供数据支持！[加油]
                  </div>
                  <div style="font-family:'Courier New',Consolas,monospace;font-size:7px;color:#3f8f5b;font-weight:400;text-align:center;border-top:1px dashed #0d9b4c;padding-top:4.5px;">
                    DOS MONITOR · 复古终端 · 微信竖版阅读版 · 仅供研究参考
                  </div>
                  <div style="margin-top:6px;font-family:'Courier New',Consolas,monospace;font-size:8px;color:#2c6742;font-weight:400;">C:\\OCTOPUS\\AI&gt; EXIT<span>█</span></div>
                </div>
              </div>

            </div>`;

            // 新栏目：Seeking Alpha 最新分析（仅真实读取成功时附加，失败静默降级，绝不推送示例数据）
            let saHtml = '';
            try {
              const saR = await fetch('http://localhost:3000/api/seekingalpha');
              const saD = await saR.json();
              if (saR.ok && saD && saD.ok && !saD.demo && saD.html) {
                saHtml = saD.html;
                console.log(`✅ 已附加 SEEKING ALPHA 最新分析栏目（${(saD.items || []).length} 条）`);
              } else {
                console.log('ℹ️ Seeking Alpha 栏目未附加：', (saD && saD.error) || ('HTTP ' + saR.status));
              }
            } catch (e) {
              console.log('ℹ️ Seeking Alpha 栏目异常，跳过：', e.message);
            }

            // 不推个股页：发送前剥离个股板块/个股页
            // 与网页端 /api/push 同一套本地词库：只过滤页面可见文本，命中统一替换为 xxx。
            const filteredPage = filterSensitiveHtml(stripStockSections((summaryHtml || '') + saHtml + baseContent), { collectMatches: true });
            const title = '章鱼 AI · 舆情量化分析';
            const filteredTitle = filterSensitiveText(title, { collectMatches: true });
            const safeTitle = filteredTitle.text;
            const content = compactBriefHtml(filteredPage.text);
            const sensitiveHits = filteredPage.matches.length + filteredTitle.matches.length;
            if (sensitiveHits) {
              const dict = getSensitiveWordStats();
              console.log(`[sensitive-filter] 推送前已将 ${sensitiveHits} 处命中替换为 xxx（本地词库 ${dict.words} 个词）`);
            }
            fs.writeFileSync('brief.html', content);

            // 10 万文字控制：单条推送内容按字符数计，不超过 100,000 字符（10 万字），超出按 section 边界自动分条
            const PUSHPLUS_MAX_CHARS = 100000;
            const htmlLen = t => String(t || '').length;
            function splitHtmlBySections(html, maxChars = PUSHPLUS_MAX_CHARS) {
              const parts=[]; const secs = html.split(/(?=<section\b)/i).filter(s=>s.trim()); let buf='';
              const flush=()=>{ if(buf.trim()){ parts.push(buf); buf=''; } };
              const splitOversizedSection=(sec,max)=>{
                const out=[]; const headMatch=sec.match(/^<section\b[^>]*>/i); const head=headMatch?headMatch[0]:'<section>'; const tailMatch=sec.match(/<\/section>\s*$/i); const tail=tailMatch?tailMatch[0]:'</section>'; const headEnd=headMatch?headMatch[0].length:9; const inner=sec.slice(headEnd, sec.length-tail.length); const pieceBudget=max-htmlLen(head+tail);
                if(pieceBudget<=0){ let s=sec; while(htmlLen(s)>max){ let lo=0,hi=s.length; while(lo<hi){const mid=(lo+hi+1)>>1; if(htmlLen(s.slice(0,mid))<=max) lo=mid; else hi=mid-1;} out.push(s.slice(0,lo)); s=s.slice(lo);} if(s) out.push(s); return out; }
                const chunks=inner.split(/(?=<\/p>|<p\b|<br\s*\/?>|。)/i); let cur='';
                for(const c of chunks){ if(htmlLen(c)>pieceBudget){ if(cur){ out.push(head+cur+tail); cur=''; } let s=c; while(htmlLen(s)>pieceBudget){ let lo=0,hi=s.length; while(lo<hi){const mid=(lo+hi+1)>>1; if(htmlLen(s.slice(0,mid))<=pieceBudget) lo=mid; else hi=mid-1;} let cut=lo; const win=s.slice(Math.max(0,lo-200),lo); const m=win.match(/[。！？\n]/g); if(m) cut=lo-200+win.lastIndexOf(m[m.length-1])+1; out.push(head+s.slice(0,cut)+tail); s=s.slice(cut);} if(s) cur=s; } else if(htmlLen(cur+c)>pieceBudget && cur){ out.push(head+cur+tail); cur=c; } else { cur+=c; } } if(cur) out.push(head+cur+tail); return out;
              };
              for(const sec of secs){ if(htmlLen(sec)>maxChars){ flush(); for(const p of splitOversizedSection(sec,maxChars)) parts.push(p); continue; } if(htmlLen(buf+sec)>maxChars) flush(); buf+=sec; } flush(); return parts;
            }

            let header='', footer='', bodyOnly=content;
            const firstIdx=content.search(/<section\b/i); const lastEnd=content.toLowerCase().lastIndexOf('</section>');
            if(firstIdx!==-1 && lastEnd!==-1 && lastEnd>firstIdx){ header=content.slice(0,firstIdx); footer=content.slice(lastEnd+'</section>'.length); bodyOnly=content.slice(firstIdx,lastEnd+'</section>'.length); }
            else if(firstIdx!==-1){ header=content.slice(0,firstIdx); bodyOnly=content.slice(firstIdx); footer=''; }
            const overhead=htmlLen(header+footer);
            let chunks= overhead>PUSHPLUS_MAX_CHARS ? splitHtmlBySections(content,PUSHPLUS_MAX_CHARS) : splitHtmlBySections(bodyOnly, PUSHPLUS_MAX_CHARS-overhead);
            if(!chunks.length){ const fb=(header+bodyOnly+footer)||content; chunks=splitHtmlBySections(fb,PUSHPLUS_MAX_CHARS); if(!chunks.length) chunks=[fb]; if(header||footer){header=''; footer='';} }
            console.log(`内容 ${htmlLen(content)} 字符（10 万字上限），分 ${chunks.length} 条发送`);
            fs.writeFileSync('chunks.json', JSON.stringify({header, footer, chunks, title: safeTitle}, null, 2));

            const token = process.env.PUSHPLUS_TOKEN;
            // 一对多群推送：PushPlus 群组 topic（群名 oai.1），群内成员全部可达；可用 PUSHPLUS_TOPIC 覆盖
            const topic = String(process.env.PUSHPLUS_TOPIC || 'oai.1').trim();
            let okCount=0;
            for(let i=0;i<chunks.length;i++){
              const partTitle = chunks.length>1 ? `${safeTitle} (${i+1}/${chunks.length})` : safeTitle;
              const partContent = (header||footer) ? `${header}${chunks[i]}${footer}` : chunks[i];
              const payload = JSON.stringify({ token, title: partTitle, content: partContent, template: 'html', channel: 'wechat', ...(topic ? { topic } : {}) });
              console.log(`推送 ${i+1}/${chunks.length}: ${partTitle} (${htmlLen(partContent)} 字符${topic ? ' · 群 ' + topic : ''})`);
              let r, text, data;
              try {
                r = await fetch('https://www.pushplus.plus/send', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: payload });
                text = await r.text();
                try{ data=JSON.parse(text);}catch{ data={raw:text} }
              } catch(e){
                console.error(`第 ${i+1} 条网络异常:`, e.message);
                process.exit(1);
              }
              console.log(`  -> HTTP ${r.status}`, JSON.stringify(data).slice(0,500));
              if(data.code!==200){ console.error(`第 ${i+1} 条失败:`, data.msg||data.raw||JSON.stringify(data)); process.exit(1); }
              okCount++;
              if(i < chunks.length-1) await new Promise(r=>setTimeout(r,800));
            }
            console.log(`推送完成 ${okCount}/${chunks.length}`);
          NODE
          fi

          kill $SERVER_PID 2>/dev/null || true

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scan-result
          path: |
            scan_result.json
            brief.html
            chunks.json
